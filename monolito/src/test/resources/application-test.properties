# Datasource Oracle aislado para testing (evita utilizar el esquema de desarrollo clase10).
# Cuando se utiliza Testcontainers con @ServiceConnection (OracleContainer), Spring Boot
# reemplaza dinámicamente url, username y password por los del contenedor efímero.
spring.datasource.url=${DB_MONOLITO_TEST_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
spring.datasource.username=${DB_MONOLITO_TEST_USERNAME:MONOLITO_TEST}
spring.datasource.password=${DB_MONOLITO_TEST_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Flyway y JPA sobre el esquema de prueba
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history_monolito
spring.jpa.hibernate.ddl-auto=validate

# Topics para pruebas (ambas claves para compatibilidad con configuración y tests)
app.kafka.topics.pedidos-creado=pedidos.creado.v2
app.kafka.topic.pedido-creado=pedidos.creado.v2

# Evitar ejecuciones automáticas de tareas programadas
spring.task.scheduling.enabled=false