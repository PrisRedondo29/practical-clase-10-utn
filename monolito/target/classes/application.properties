server.port=8080

# Conexión a Oracle Database Free (Misma instancia XEPDB1 con esquema propio)
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
spring.datasource.username=clase10
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Configuración de migraciones Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate: solo valida el esquema gestionado por Flyway
spring.jpa.hibernate.ddl-auto=validate

clientes.service.base-url=http://localhost:8091
clientes.service.connect-timeout=2s
clientes.service.read-timeout=3s

# Broker Kafka local
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
