server.port=8080

# Conexión a Oracle Database Free (Misma instancia XEPDB1 con esquema propio)
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
spring.datasource.username=${DB_USERNAME:clase10}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Configuración de migraciones Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate: solo valida el esquema gestionado por Flyway
spring.jpa.hibernate.ddl-auto=validate

clientes.service.base-url=${CLIENTES_SERVICE_BASE_URL:http://localhost:8091}
clientes.service.connect-timeout=2s
clientes.service.read-timeout=3s

# Broker Kafka local
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.admin.auto-create=${APP_OUTBOX_PUBLISHER_ENABLED:true}
app.kafka.topics.pedidos-creado=pedidos.creado.v2
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
headers.spring.kafka.producer.properties.spring.json.add.type.headers=false

#Outbox 
app.outbox.publisher.enabled=${APP_OUTBOX_PUBLISHER_ENABLED:true}
app.outbox.intervalo-ms=5000

# Identificación de instancia
app.instance.id=${APP_INSTANCE_ID:${HOSTNAME:${COMPUTERNAME:local}}}