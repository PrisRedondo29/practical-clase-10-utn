spring.application.name=monolito
server.port=${SERVER_PORT:8090}

spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
spring.datasource.username=${DB_USERNAME:MONOLITO_USER}
spring.datasource.password=${DB_PASSWORD:monolito_pass}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.flyway.enabled=true
