server.port=8092

# Conexión a Oracle Database Free (Esquema propio de Analytics)
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
spring.datasource.username=${DB_ANALYTICS_USERNAME:analytics}
spring.datasource.password=${DB_ANALYTICS_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Configuración de migraciones Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate: valida el esquema gestionado exclusivamente por Flyway
spring.jpa.hibernate.ddl-auto=validate
