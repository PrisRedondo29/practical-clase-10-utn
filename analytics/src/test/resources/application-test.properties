# Oracle exclusivo para testing
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
spring.datasource.username=ANALYTICS_TEST
spring.datasource.password=${DB_ANALYTICS_TEST_PASSWORD}

# Flyway y JPA
spring.flyway.enabled=true
spring.flyway.table=flyway_schema_history_analytics
spring.jpa.hibernate.ddl-auto=validate

# Configuracion Kafka para tests
spring.kafka.listener.concurrency=1
spring.kafka.consumer.group-id=analytics-test
spring.kafka.consumer.auto-offset-reset=earliest
app.kafka.topic.pedido-creado=pedidos.creado.v2

# Desactivar fallas artificiales en pruebas normales
app.demo.falla-persistente=false