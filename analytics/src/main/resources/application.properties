server.port=8092

# Conexión a Oracle Database Free (Esquema propio de Analytics)
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
spring.datasource.username=${DB_ANALYTICS_USERNAME:analytics}
spring.datasource.password=${DB_ANALYTICS_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Configuración de migraciones Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate: valida el esquema gestionado exclusivamente por Flyway
spring.jpa.hibernate.ddl-auto=validate

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=analytics-pedidos
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=ar.edu.utn.ba.capacitacion.analytics.evento.PedidoCreado
spring.kafka.listener.concurrency=3