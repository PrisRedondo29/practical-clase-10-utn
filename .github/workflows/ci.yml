name: CI - Calidad de Pedidos

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Java - Tests y build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: monolito

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v7

      - name: Preparar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: monolito/pom.xml

      - name: Ejecutar pruebas y construir JAR
        run: mvn -B verify '-Dtest=*Test,*IntegracionTest'

  frontend:
    name: React - Tests y build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v7

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas de React
        run: npm run test:run

      - name: Construir frontend
        run: npm run build