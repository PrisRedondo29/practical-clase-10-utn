openapi: 3.0.3
info:
  title: Clientes API
  version: 1.0.0
servers:
  - url: http://localhost:8091
paths:
  /api/clientes/{id}:
    get:
      summary: Consulta un cliente por su ID
      operationId: obtenerCliente
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Cliente encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClienteDetalleResponse'
        '404':
          description: El cliente no existe
components:
  schemas:
    ClienteDetalleResponse:
      type: object
      required: [id, nombre, activo]
      properties:
        id:
          type: integer
          format: int64
        nombre:
          type: string
        activo:
          type: boolean