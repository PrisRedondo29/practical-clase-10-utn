server.port=8091

# Misma instancia Oracle que el monolito
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
spring.datasource.username=clase10
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# El esquema (tabla CLIENTES) sigue siendo gestionado por las migraciones Flyway del monolito.
# Este servicio solo valida que las entidades coincidan con el esquema existente.
spring.jpa.hibernate.ddl-auto=validate