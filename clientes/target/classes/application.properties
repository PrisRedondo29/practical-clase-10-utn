spring.application.name=clientes-service
server.port=8091

# Misma instancia Oracle que el monolito, pero con usuario/esquema propio de Clientes
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
spring.datasource.username=clase10
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Migraciones Flyway (se ejecutan sobre el esquema del usuario clientes_svc)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate: solo valida el esquema gestionado por Flyway
spring.jpa.hibernate.ddl-auto=validate